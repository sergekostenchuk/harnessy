# harnessy.ai — тот же сайт, что harness.autoiflow.com, под именем продукта (05.10.2026).
# Копия блока сайта с собственным сертификатом; блоки harness.autoiflow.com и nl99.autoiflow.com не трогаем.
# www.harnessy.ai → harnessy.ai. Откат: убрать ссылку из sites-enabled и перечитать nginx.
server {
    listen 80;
    listen [::]:80;
    server_name harnessy.ai www.harnessy.ai;
    root /harness/site;

    location ^~ /.well-known/acme-challenge/ {
        root /harness/site;
        default_type "text/plain";
    }
    location / { return 301 https://harnessy.ai$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harnessy.ai;

    ssl_certificate     /etc/letsencrypt/live/harnessy.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harnessy.ai/privkey.pem;
    # TLS-параметры — те же, что у блока nl99 (на сервере нет options-ssl-nginx.conf)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Доступ: только cookie сервиса входа (auth_request → 127.0.0.1:8791). Без cookie → страница входа (без браузерного окна пароля).
    auth_request         /auth/check;
    error_page 401 = @need_login;
    location @need_login { return 302 /auth/login?next=$request_uri; }

    location = /auth/check {
        internal;
        auth_basic off; auth_request off;
        proxy_pass http://127.0.0.1:8791;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    # Запасной вход по паролю для скриптов/curl: только по этому адресу; в браузере на / окно не всплывает
    location = /auth/basic {
        auth_request off;
        auth_basic "harness"; auth_basic_user_file /etc/nginx/.htpasswd-harness;
        root /harness/site; try_files /sketches/harness.html =404;
    }
    location = /auth/pour-intro.mp4 { auth_basic off; auth_request off; alias /harness/site/media/pour-intro.mp4; add_header Cache-Control "public, max-age=86400"; }
    location = /auth/pour-intro.jpg { auth_basic off; auth_request off; alias /harness/site/media/pour-intro.jpg; add_header Cache-Control "public, max-age=86400"; }
    location /auth/ {
        auth_basic off; auth_request off;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Next $request_uri;
        proxy_intercept_errors off;
    }

    access_log /var/log/nginx/harness.access.log;
    error_log  /var/log/nginx/harness.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /harness/site;
    index index.html;

    # Сборка Workbench (карта OM). /map/om-map/ → симлинк на /harness/map-data
    location ^~ /map/ {
        root /harness;
        try_files $uri $uri/ /map/index.html;
    }

    # Данные карты: всегда свежие, без кеша; листинг папки разрешён
    location ^~ /map-data/ {
        root /harness;
        autoindex on;
        add_header Cache-Control "no-store" always;
    }

    # Публичные страницы (нужны Google для публикации экрана согласия)
    location ~ ^/(privacy|terms)\.html$ { auth_basic off; auth_request off; }
    # Публичная статья о Harnessy и её видео/постеры — без входа (слово владельца 22.10.2026)
    location = /article.html { auth_basic off; auth_request off; }
    location ^~ /media/ { auth_basic off; auth_request off; types { video/mp4 mp4; image/jpeg jpg; } add_header Accept-Ranges bytes; }
    location ~ ^/sketches/disarto/(article|style)\.css$ { auth_basic off; auth_request off; }

    # Стартовая страница — прототип на экране «Новый чат» (слово владельца 04.10). обзор — вкладка Настройки · About (/#s=about)
    # Главная — публичная статья (слово владельца 22.10.2026); прежний прототип — /demo (за входом, как раньше)
    location = / { auth_basic off; auth_request off; try_files /article.html =404; }
    location = /demo { try_files /sketches/harness.html =404; }
    location = /demo/ { try_files /sketches/harness.html =404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.harnessy.ai;
    ssl_certificate     /etc/letsencrypt/live/harnessy.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harnessy.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://harnessy.ai$request_uri;
}
