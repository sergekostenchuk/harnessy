<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Harnessy · эскиз 24 · налив, живой кадр поверх фото</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#050506;overflow:hidden}#c{display:block;width:100vw;height:100vh;cursor:pointer}
.cap{position:fixed;left:18px;bottom:14px;font:10px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#4a4e57;pointer-events:none}</style></head>
<body><canvas id="c"></canvas><div class="cap" id="cap">harnessy · эскиз 24 · покой → налив · клик — начать</div>
<script>
/* Эскиз 24 — живая заставка: два кадра генератора (покой / налив) как база, поверх — один canvas:
   дождь струн и капли, мерцание цифр в стекле (ячейки берутся с самого фото по тёплым светлым точкам), дыхание свечения,
   пробегающий блик, переход «покой → налив» с лёгким наездом камеры, дорисованная струя и растущий уровень в бокале.
   API: window.__step(dt) — ручной шаг (рендер клипа, ?manual=1); клик — начать/вернуть; ?auto=1 — цикл для демонстрации. */
(function(){
const Q=new URLSearchParams(location.search), MANUAL=Q.get('manual')==='1', AUTO=Q.get('auto')==='1';
const F='"JetBrains Mono","Hiragino Sans",monospace', KAT='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ', DG='0123456789';
const cv=document.getElementById('c'), g=cv.getContext('2d'); let cw=0,ch=0,dpr=1;
const IM={idle:new Image(),pour:new Image()}; IM.idle.src='pour-idle.jpg'; IM.pour.src='pour-pour.jpg';
// нормированные координаты по кадру «налив» (доли ширины/высоты); подстраиваются параметрами адреса
const P={lipX:+(Q.get('lipX')||.608),lipY:+(Q.get('lipY')||.318),landX:+(Q.get('landX')||.682),landY:+(Q.get('landY')||.70),
  bowlX:+(Q.get('bowlX')||.6875),bowlY:+(Q.get('bowlY')||.685),bowlRX:+(Q.get('bowlRX')||.07),bowlRY:+(Q.get('bowlRY')||.106),lv0:+(Q.get('lv0')||.73),lv1:+(Q.get('lv1')||.655),
  botIdle:[.49,.54,.15,.36,0], botPour:[.42,.38,.22,.24,-.6]};
const S={state:'idle',mix:0,level:0,glow:0,t:0,st:0,fadeOut:0};
let seed=5; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
const hash=(x,y)=>{ let h=(x*73856093)^(y*19349663)^0x9e3779b9; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967296; };
const glyph=(x,y,k)=>{ const r=hash(x,y+k*977); return r<.45?KAT[Math.floor(hash(x+7,y)*KAT.length)]:DG[Math.floor(hash(x+13,y)*10)]; };
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let fit=null, rain=[], drops=[], masks={idle:null,pour:null}, cellG=12;
function size(){ cw=+Q.get('w')||Math.round(innerWidth*(dpr=Math.min(2,devicePixelRatio||1))); ch=+Q.get('h')||Math.round(innerHeight*dpr); cv.width=cw; cv.height=ch;
  const iw=IM.idle.naturalWidth||2576, ih=IM.idle.naturalHeight||1438, sc=Math.max(cw/iw,ch/ih); fit={sc,dw:iw*sc,dh:ih*sc,ox:(cw-iw*sc)/2,oy:(ch-ih*sc)/2};
  cellG=Math.max(6,Math.round(cw/170)); rain=[]; const cols=Math.ceil(cw/(cw/96)); for(let i=0;i<cols;i++) rain.push({x:(i+.5)*(cw/96),v:.9+rnd()*1.6,ph:rnd()*40,len:10+Math.floor(rnd()*26),a:.05+rnd()*.12,far:rnd()<.5});
  drops=[]; for(let i=0;i<34;i++) drops.push({x:rnd(),y:rnd(),v:.08+rnd()*.16,sz:.012+rnd()*.02,n:3+Math.floor(rnd()*4),warm:rnd()<.35,front:rnd()<.3});
  masks={idle:null,pour:null}; }
const px=(u,v)=>[fit.ox+u*fit.dw, fit.oy+v*fit.dh];
function buildMask(img){ const cols=Math.ceil(cw/cellG), rows=Math.ceil(ch/cellG); const o=document.createElement('canvas'); o.width=cols; o.height=rows; const c=o.getContext('2d'); c.drawImage(img,fit.ox/cellG,fit.oy/cellG,fit.dw/cellG,fit.dh/cellG); const d=c.getImageData(0,0,cols,rows).data; const out=[];
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ const i=(y*cols+x)*4, R=d[i],G=d[i+1],B=d[i+2]; const lum=(.3*R+.59*G+.11*B)/255; if(R>140&&R>G+18&&G>B+24&&lum>.33&&hash(x,y)<.75) out.push({x:(x+.5)*cellG,y:(y+.5)*cellG,ph:hash(x+3,y+5),hot:lum>.62}); }
  return out; }
function advance(dt){ S.t+=dt; S.st+=dt;
  if(S.state==='idle'){ S.mix=Math.max(0,S.mix-dt/1.4); S.level=Math.max(0,S.level-dt/.8); S.glow=Math.max(0,S.glow-dt/.8); if(AUTO&&S.st>3.6) start(); }
  else if(S.state==='pour'){ S.mix=Math.min(1,S.mix+dt/1.4); if(S.mix>=1){ S.level=Math.min(1,S.level+dt/7.5*(1.35-S.level)); if(S.level>=.995) set('done'); } }
  else if(S.state==='done'){ S.glow=Math.min(1,S.glow+dt/1.1); if(AUTO&&S.st>3.2) set('idle'); } }
function set(s){ S.state=s; S.st=0; const cap=document.getElementById('cap'); if(cap) cap.textContent='harnessy · эскиз 24 · '+(s==='idle'?'покой · клик — начать налив':s==='pour'?'налив…':'готово · клик — вернуть'); }
function start(){ if(S.state==='idle') set('pour'); }
cv.addEventListener('click',()=>{ if(S.state==='idle') start(); else if(S.state==='done') set('idle'); });
function draw(){ if(!fit) return; const t=S.t, m=ease(S.mix);
  // 1. фото: покой → налив с лёгким наездом
  g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.fillStyle='#050506'; g.fillRect(0,0,cw,ch);
  const push=1+.03*m; g.save(); g.translate(cw/2,ch/2); g.scale(push,push); g.translate(-cw/2,-ch/2);
  g.drawImage(IM.idle,fit.ox,fit.oy,fit.dw,fit.dh); if(m>0){ g.globalAlpha=m; g.drawImage(IM.pour,fit.ox,fit.oy,fit.dw,fit.dh); g.globalAlpha=1; }
  g.restore();
  g.textAlign='center'; g.textBaseline='middle'; g.globalCompositeOperation='lighter';
  // 2. дождь струн — фоном, поверх фото, тихо
  const rows=Math.ceil(ch/cellG); for(const r of rain){ const head=(t*r.v*6+r.ph*rows)%(rows+r.len); g.font='500 '+(cellG*(r.far?.9:1.05)).toFixed(1)+'px '+F;
    for(let j=0;j<r.len;j++){ const y=Math.floor(head)-j; if(y<0||y>=rows) continue; const k=1-j/r.len; const a=r.a*k*k*(r.far?.6:1); g.fillStyle=j===0?'rgba(255,214,150,'+(a*2.2).toFixed(3)+')':'rgba(214,170,90,'+a.toFixed(3)+')'; g.fillText(glyph(Math.round(r.x),y+Math.floor(head/97),0),r.x,(y+.5)*cellG); } }
  // 3. крупные капли — часть перед сценой
  for(const d of drops){ const yy=((d.y+t*d.v)%1.25)*ch-ch*.12; const sz=d.sz*cw; g.font='600 '+sz.toFixed(1)+'px '+F; for(let j=0;j<d.n;j++){ const k=1-j/d.n, y=yy-j*sz*1.05; const a=(d.front?.07:.045)+(d.front?.2:.14)*k*k; g.fillStyle=(j===0&&d.warm)?'rgba(255,196,110,'+(a+.14).toFixed(3)+')':'rgba(200,190,170,'+a.toFixed(3)+')'; g.fillText(glyph(Math.round(d.x*997),j,2),d.x*cw,y); } }
  // 4. мерцание цифр в стекле и на столе — ячейки с самого фото
  if(!masks.idle&&IM.idle.complete) masks.idle=buildMask(IM.idle); if(!masks.pour&&IM.pour.complete) masks.pour=buildMask(IM.pour);
  const fl=(cells,wgt)=>{ if(!cells||wgt<=0.02) return; g.font='600 '+(cellG*.95).toFixed(1)+'px '+F; for(const c of cells){ const s=Math.sin(t*1.7+c.ph*6.283); if(s<0) continue; const a=(c.hot?.26:.14)*s*wgt; g.fillStyle=c.hot?'rgba(255,214,150,'+a.toFixed(3)+')':'rgba(194,122,52,'+a.toFixed(3)+')'; g.fillText(glyph(Math.round(c.x),Math.round(c.y),Math.floor(t*1.7+c.ph*6)),c.x,c.y); } };
  fl(masks.idle,1-m); fl(masks.pour,m);
  // 5. дыхание свечения у бутылки + блик в покое
  const bb=m<.5?P.botIdle:P.botPour; const [bx,by]=px(bb[0],bb[1]); const rad=g.createRadialGradient(bx,by,10,bx,by,bb[3]*fit.dh*1.3); const ga=.05+.035*Math.sin(t*.9)+.16*S.glow; rad.addColorStop(0,'rgba(255,170,80,'+ga.toFixed(3)+')'); rad.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rad; g.fillRect(0,0,cw,ch);
  if(S.state==='idle'){ const q=(t%7)/1.6; if(q<1){ g.save(); g.beginPath(); g.ellipse(bx,by,bb[2]*fit.dw,bb[3]*fit.dh,bb[4],0,Math.PI*2); g.clip(); g.translate(bx,by); g.rotate(.35); const X=-bb[2]*fit.dw*1.4+bb[2]*fit.dw*2.8*q; const lg=g.createLinearGradient(X-40,0,X+40,0); lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(.5,'rgba(255,240,210,.16)'); lg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=lg; g.fillRect(-cw,-ch,2*cw,2*ch); g.restore(); } }
  // 6. струя и уровень — поверх кадра «налив»
  if(m>.25){ const a=(m-.25)/.75; const [lx,ly]=px(P.lipX,P.lipY), [dx,dy]=px(P.landX,P.landY); const [cxb,cyb]=px(P.bowlX,P.bowlY); const rx=P.bowlRX*fit.dw, ry=P.bowlRY*fit.dh; const lvY=px(0,P.lv0+(P.lv1-P.lv0)*ease(S.level))[1];
    g.globalCompositeOperation='source-over'; g.save(); g.beginPath(); g.ellipse(cxb,cyb,rx,ry,0,0,Math.PI*2); g.clip();
    const lq=g.createLinearGradient(cxb-rx,0,cxb+rx,0); lq.addColorStop(0,'rgba(60,20,6,.78)'); lq.addColorStop(.5,'rgba(176,92,30,.62)'); lq.addColorStop(1,'rgba(70,24,8,.78)'); g.fillStyle=lq; g.globalAlpha=a*Math.min(1,S.level*4+.15); g.fillRect(cxb-rx-2,lvY,rx*2+4,ry*2);
    g.fillStyle='rgba(255,214,168,.7)'; g.fillRect(cxb-rx-2,lvY-1,rx*2+4,2); g.globalAlpha=1;
    for(let i=0;i<3;i++){ const ph=((t*1.1+i*.33)%1); g.beginPath(); g.ellipse(dx,lvY+2,8+ph*rx*.9,2+ph*ry*.22,0,0,Math.PI*2); g.strokeStyle='rgba(255,210,160,'+(.35*(1-ph)*a).toFixed(3)+')'; g.lineWidth=1.2; g.stroke(); }
    g.restore();
    if(S.state==='pour'||S.level<.995){ const flow=S.state==='pour'?1:0; g.globalCompositeOperation='lighter'; const c1=[lx+(dx-lx)*.15,ly+(dy-ly)*.55], c2=[dx-(dx-lx)*.02,dy-(dy-ly)*.3];
      g.beginPath(); g.moveTo(lx,ly); g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],dx,lvY); g.lineCap='round'; g.strokeStyle='rgba(230,150,70,'+(.5*a*flow).toFixed(3)+')'; g.lineWidth=cw*.006; g.shadowColor='rgba(230,150,70,.8)'; g.shadowBlur=cw*.008; g.stroke(); g.shadowBlur=0;
      g.strokeStyle='rgba(255,230,190,'+(.55*a*flow).toFixed(3)+')'; g.lineWidth=cw*.0018; g.stroke();
      g.font='600 '+(cellG*.8).toFixed(1)+'px '+F; const n=22; for(let i=0;i<n;i++){ const u=((i/n)+t*.9)%1; const x=(1-u)**3*lx+3*(1-u)**2*u*c1[0]+3*(1-u)*u*u*c2[0]+u**3*dx, y=(1-u)**3*ly+3*(1-u)**2*u*c1[1]+3*(1-u)*u*u*c2[1]+u**3*lvY; g.fillStyle='rgba(255,205,140,'+(.5*a*flow*(.4+.6*u)).toFixed(3)+')'; g.fillText(DG[Math.floor(hash(i,Math.floor(t*9+i))*10)],x,y); } } }
  // 7. виньетка
  g.globalCompositeOperation='source-over'; const v=g.createRadialGradient(cw*.5,ch*.5,ch*.3,cw*.5,ch*.5,ch*.95); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.6)'); g.fillStyle=v; g.fillRect(0,0,cw,ch); }
let last=0; function loop(now){ requestAnimationFrame(loop); const dt=Math.min(.05,(now-last)/1000)||0; last=now; advance(dt); draw(); }
window.__step=dt=>{ advance(dt); draw(); }; window.__start=start; window.__set=set; window.__S=S;
Promise.all([new Promise(r=>IM.idle.complete?r():IM.idle.onload=r),new Promise(r=>IM.pour.complete?r():IM.pour.onload=r),document.fonts.ready]).then(()=>{ size(); window.__ready=true; if(!MANUAL){ addEventListener('resize',()=>{ size(); }); requestAnimationFrame(loop); } else draw(); });
})();
</script></body></html>
