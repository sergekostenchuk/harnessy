appId: com.harnessy.alpha
productName: Harnessy-alpha
asar: true
npmRebuild: false
removePackageScripts: true
compression: maximum
directories:
  output: release
files:
  - main.js
  - engine.js
  - preload.js
  - context-menu.js
  - trace.js
  - package.json
extraResources:
  - from: engine
    to: engine
    filter:
      - package.json
      - package-lock.json
      - manifest.json
  - from: engine/node_modules
    to: engine/node_modules
    filter:
      - '**/*'
  - from: ../deploy/out/site
    to: site
mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
artifactName: Harnessy-alpha-${version}-${arch}.${ext}
