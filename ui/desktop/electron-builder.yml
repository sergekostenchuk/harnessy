appId: com.harnessy.alpha
productName: Harnessy-alpha
asar: true
npmRebuild: false
removePackageScripts: true
compression: maximum
afterPack: ./after-pack.cjs
directories:
  output: release
files:
  - main.js
  - engine.js
  - preload.js
  - updates.js
  - context-menu.js
  - trace.js
  - package.json
extraResources:
  - from: engine
    to: engine
    filter:
      - package.json
      - package-lock.json
      - manifest.json
  - from: engine/node_modules
    to: engine/node_modules
    filter:
      - '**/*'
  - from: ../deploy/out/site
    to: site
mac:
  icon: icon.icns
  forceCodeSigning: true
  identity: Developer ID Application
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
artifactName: Harnessy-alpha-${version}-${arch}.${ext}
generateUpdatesFilesForAllChannels: true
# Owner confirmation is required before enabling checks or publishing.
publish:
  provider: github
  owner: sergekostenchuk
  repo: OWNER_CONFIRM_RELEASE_REPOSITORY
