      const app=document.getElementById('ui-app'); const ar=app.getBoundingClientRect(); const k=ar.width>0?ar.width/1600:0;
      const P=(id,fx,fy,dx,dy)=>{ const el=document.getElementById(id); const r=el&&k?el.getBoundingClientRect():null; if(!r||!r.width) return {x:fx,y:fy}; return {x:(r.left-ar.left)/k+r.width/2+(dx||0),y:(r.top-ar.top)/k+r.height/2+(dy||0)}; };
      const pIn1=P('ui-in1',1120,500,190,6), pGo1=P('ui-go1',1280,560), pBox1=P('ui-box1',930,520), pBox2=P('ui-box2',930,800);
      const pIn2=P('ui-in2',1120,790,190,6), pGo2=P('ui-go2',1280,850), pTp=P('ui-tp0',1430,23,-10,0), pIt=P('ui-it-alpha',1300,130,-60,0), pOk=P('ui-conf-ok',1260,250,-10,0);
      const rowTop=id=>{ const el=document.getElementById(id); const r=el&&k?el.getBoundingClientRect():null; return r&&r.height?(r.top-ar.top)/k:0; };
      const yChat1=rowTop('ui-gproj')+ (k? (document.querySelector('#ui-gproj').getBoundingClientRect().height/k):23), yCoffee=rowTop('ui-coffee');
      const dyCoffee=(k&&yCoffee)?(yChat1-yCoffee):-150;

      /* камера и курсор в координатах приложения; базовый масштаб 1.0 = весь экран (1600×900 в 1920×912) */
      const BASE=1.0;
      const tl=gsap.timeline({paused:true});
      let cam={s:BASE,rx:-160,ry:-6};
      function camTo(t,dur,s,rx,ry,ease){
        ease=ease||'power2.inOut';
        tl.fromTo('#ui-cam',{scale:cam.s,x:-cam.rx*cam.s,y:-cam.ry*cam.s},{immediateRender:false,scale:s,x:-rx*s,y:-ry*s,duration:dur,ease},t);

        tl.fromTo('#ui-cur-s',{scale:1},{immediateRender:false,scale:.86,duration:.06,ease:'power2.out'},t);

      function typeIn(t,chars,step){ tl.fromTo(chars,{display:'none'},{immediateRender:false,display:'inline',duration:.01,stagger:step},t); return t+step*chars.length; }
      function swap(sel,i,t){ const s=document.querySelectorAll(sel+' > span'); s.forEach((e,j)=>tl.set(e,{opacity:j===i?1:0},t)); }
      gsap.set('#ui-cam',{scale:BASE,x:160,y:6});
      gsap.set('#ui-cur-in',{x:cur.x,y:cur.y,scale:1});
      gsap.set('#ui-coffee',{opacity:0});

      /* сцена 1 · 0–2.6: весь экран; курсор в композер; наезд; клик; печать «как заварить кофе в турке»; клик по отправке */

      /* сцена 2 · 2.6–5.4: отправка — композер уезжает вниз, лента; пузырь, «думал», ответ; строка чата в панели; шапка «2 сообщения» */
