  <script>

        cons:'<rect x="3" y="5" width="7" height="6" rx="1.5"/><rect x="14" y="13" width="7" height="6" rx="1.5"/><path d="M10 8h2a2 2 0 012 2v4"/>',test:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/>',ux:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 12l3-3 2 2 4-4"/>',

      /* координаты в приложении (1600×900) — измеряем до трансформаций; запасные значения — если разметка ещё не в документе */

      const pTab=P('ui-tab-team',1180,23), pRev=P('ui-card-rev',564,535), pPlus=P('ui-plus',1372,68), pTest=P('ui-it-test',1232,268,-40,0), pLogo=P('ui-plogo',28,26);

      /* геометрия полотна (координаты .om-view), как в движке team-canvas.js: оргсхема — вертикальные кривые, живое сообщение — полоса под карточками */
      const OX=356, OY=16, OW=600, CT=357, CW=204;
      const oh=el('ui-orch').offsetHeight||255;
      const X4=[188,432,676,920], X5=[66,310,554,798,1042];
      const CARDS=['ui-card-rev','ui-card-w1','ui-card-w2','ui-card-res','ui-card-test'];
      const hs=CARDS.map(id=>el(id).offsetHeight||104);
      const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
      const cubic=(a,b,c,d,e,f,g,h)=>'M'+a+' '+b+' C'+c+' '+d+','+e+' '+f+','+g+' '+h;
      const org=bx=>{ const ay=OY+oh, o=clampN((CT-ay)/2,24,80), ax=clampN(bx,OX+36,OX+OW-36); return cubic(ax,ay,ax,ay+o,bx,CT-o,bx,CT); };
      const live=xs=>{ const ab=CT+hs[1], bb=CT+hs[0], ly=Math.max(ab,bb)+52, ax=xs[1]+CW/2, bx=xs[0]+CW/2; return {d:cubic(ax,ab,ax,ly,bx,ly,bx,bb),m:[(ax+bx)/2,.125*ab+.75*ly+.125*bb]}; };
      const EDGES=['ui-e-rev','ui-e-w1','ui-e-w2','ui-e-res','ui-e-test'];
      EDGES.forEach((e,i)=>gsap.set('#'+e,{attr:{d:org((i<4?X4[i]:X5[i])+CW/2)}}));
      const L4=live(X4), L5=live(X5);
      gsap.set('#ui-e-live',{attr:{d:L4.d}});
      const lw=el('ui-lbl').offsetWidth||270, lh=el('ui-lbl').offsetHeight||21;
      gsap.set('#ui-lbl-c',{left:Math.round(L4.m[0]-lw/2),top:Math.round(L4.m[1]-lh/2)});

      /* камера и курсор в координатах приложения; базовый масштаб 1.0 = весь экран (1600×900 в 1920×912) */
      const BASE=1.0;
      const tl=gsap.timeline({paused:true});
      let cam={s:1.9,rx:440,ry:-12};
      function camTo(t,dur,s,rx,ry,ease){
        ease=ease||'power2.inOut';
        tl.fromTo('#ui-cam',{scale:cam.s,x:-cam.rx*cam.s,y:-cam.ry*cam.s},{immediateRender:false,scale:s,x:-rx*s,y:-ry*s,duration:dur,ease},t);
        tl.fromTo('#ui-cur-in',{scale:BASE/cam.s},{immediateRender:false,scale:BASE/s,duration:dur,ease},t);
        tl.fromTo('#ui-cam',{filter:'blur(0px)'},{immediateRender:false,filter:'blur(4px)',duration:dur*.5,ease:'power1.in'},t);
        tl.to('#ui-cam',{filter:'blur(0px)',duration:dur*.5,ease:'power1.out'},t+dur*.5);
        cam={s,rx,ry};
      }
      let cur={x:1700,y:700};
      function moveTo(t,dur,x,y,ease){
        tl.fromTo('#ui-cur-in',{x:cur.x,y:cur.y},{immediateRender:false,x,y,duration:dur,ease:ease||'power3.inOut'},t);
        cur={x,y};
      }
      function click(t){
        tl.fromTo('#ui-cur-s',{scale:1},{immediateRender:false,scale:.86,duration:.06,ease:'power2.out'},t);
        tl.to('#ui-cur-s',{scale:1,duration:.1,ease:'power2.out'},t+.06);
      }
      function swap(sel,i,t){ const s=document.querySelectorAll(sel+' > span'); s.forEach((e,j)=>tl.set(e,{opacity:j===i?1:0},t)); }
      gsap.set('#ui-cam',{scale:cam.s,x:-cam.rx*cam.s,y:-cam.ry*cam.s});
      gsap.set('#ui-cur-in',{x:cur.x,y:cur.y,scale:BASE/cam.s});
      gsap.set('#ui-e-live, #ui-e-test',{opacity:0});
      gsap.set('#ui-card-test',{opacity:0});

      /* состояния продукта, которые движутся сами: сектор «думает» у оркестратора и бегущий пунктир живого сообщения (постоянная скорость — единственный linear) */
      tl.fromTo('#ui-think',{rotation:0},{immediateRender:false,rotation:Math.round(360*18.85/1.1),duration:18.85,ease:'none'},0);
      tl.fromTo('#ui-e-live',{strokeDashoffset:0},{immediateRender:false,strokeDashoffset:-Math.round(22*11.25/1.1),duration:11.25,ease:'none'},7.6);

      /* сцена 1 · 0–2.4: чат проекта 1.9× (ответ «Двое ждут вас…» и полоска в одном кадре); курсор к вкладке «Команда агентов», клик → полотно; отъезд на весь экран */
      moveTo(.3,.6,pTab.x,pTab.y,'power3.out');
      tl.set('#ui-tab-team',{color:'#ececee'},1.5);
      click(1.7);
      tl.set('#ui-tab-chat',{color:'#9a9aa2',borderBottomColor:'rgba(0,0,0,0)'},1.75);
      tl.set('#ui-tab-team',{borderBottomColor:'#c27a34'},1.75);
      tl.to('#ui-chat',{opacity:0,filter:'blur(6px)',duration:.15,ease:'power2.in'},1.72);
      tl.fromTo('#ui-team',{opacity:0,filter:'blur(6px)'},{immediateRender:false,opacity:1,filter:'blur(0px)',duration:.25,ease:'power2.out'},1.78);
      camTo(1.8,.6,1.0,-160,-6);

      /* сцена 2 · 2.4–4.6: полотно целиком; подпись 1; курсор уходит вниз к карточкам */
      moveTo(3.9,.6,pRev.x+60,pRev.y+150);

      /* сцена 3 · 4.6–7.4: наезд на ряд карточек + полоса; курсор на Ревьюера — карточка приподнимается; подпись 2 */
      camTo(4.6,.55,1.9,425,330);
      moveTo(4.7,.5,pRev.x,pRev.y);
      tl.to('#ui-card-rev',{y:-2,boxShadow:'0 14px 34px rgba(0,0,0,.45)',duration:.15,ease:'power2.out'},5.25);

      tl.fromTo('#ui-e-live',{opacity:0},{immediateRender:false,opacity:1,duration:.25,ease:'power2.out'},7.6);
      tl.fromTo('#ui-lbl',{opacity:0,filter:'blur(6px)'},{immediateRender:false,opacity:1,filter:'blur(0px)',duration:.25,ease:'power2.out'},7.6);

      camTo(10.4,.55,2.0,Math.min(640,pPlus.x-600),-12);

      tl.fromTo('#ui-it-test',{backgroundColor:'rgba(32,32,36,0)'},{immediateRender:false,backgroundColor:'rgba(32,32,36,1)',duration:.12},12.8);

      camTo(13.3,.6,1.0,-160,-6);
      moveTo(13.4,.6,pPlus.x+40,pPlus.y+330,'power3.inOut');

      EDGES.slice(0,4).forEach((e,i)=>tl.to('#'+e,{attr:{d:org(X5[i]+CW/2)},duration:.6,ease:'power3.inOut'},13.5));
