  <script>

      const I={new:'<path d="M12 5v14M5 12h14"/>',find:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',inbox:'<path d="M3 13l2-8h14l2 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>',chat:'<path d="M4 6h16v10H9l-5 4z"/>',pin:'<path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/>',folder:'<path d="M3 7h6l2 2h10v10H3z"/>',

      document.querySelectorAll('#root s[data-i]').forEach(s=>{ const k=s.getAttribute('data-i'); s.outerHTML='<svg viewBox="0 0 24 24">'+(I[k]||'')+'</svg>'; });

      /* ── камера и курсор в координатах приложения (1600×900); базовый масштаб 1.0 = всё окно ── */
      const BASE=1.0;
      const tl=gsap.timeline({paused:true});
      let cam={s:BASE,rx:-160,ry:-6};
      function camTo(t,dur,s,rx,ry,ease){
        ease=ease||'power2.inOut';
        tl.fromTo('#ui-cam',{scale:cam.s,x:-cam.rx*cam.s,y:-cam.ry*cam.s},{immediateRender:false,scale:s,x:-rx*s,y:-ry*s,duration:dur,ease},t);
        tl.fromTo('#ui-cur-in',{scale:BASE/cam.s},{immediateRender:false,scale:BASE/s,duration:dur,ease},t);
        tl.fromTo('#ui-cam',{filter:'blur(0px)'},{immediateRender:false,filter:'blur(4px)',duration:dur*.5,ease:'power1.in'},t);
        tl.to('#ui-cam',{filter:'blur(0px)',duration:dur*.5,ease:'power1.out'},t+dur*.5);
        cam={s,rx,ry};
      }
      let cur={x:1700,y:700};
      function moveTo(t,dur,x,y,ease){
        tl.fromTo('#ui-cur-in',{x:cur.x,y:cur.y},{immediateRender:false,x,y,duration:dur,ease:ease||'power3.inOut'},t);
        cur={x,y};
      }
      function click(t){
        tl.fromTo('#ui-cur-s',{scale:1},{immediateRender:false,scale:.86,duration:.06,ease:'power2.out'},t);
        tl.to('#ui-cur-s',{scale:1,duration:.1,ease:'power2.out'},t+.06);
      }
      const RAISED='#1b1b1e', CLEAR='rgba(27,27,30,0)', ACC='#c27a34', INK2='#9a9aa2';
      /* пункт рейки: подсветка (.hov) → активный (.on: подложка + коньячная иконка) → выкл */
      const hov=(t,sel)=>tl.to(sel,{backgroundColor:RAISED,duration:.12},t);
      const on=(t,sel)=>{ tl.to(sel,{backgroundColor:RAISED,duration:.15},t); tl.to(sel+' svg',{stroke:ACC,duration:.15},t); };
      const off=(t,sel)=>{ tl.to(sel,{backgroundColor:CLEAR,duration:.2},t); tl.to(sel+' svg',{stroke:INK2,duration:.2},t); };
      /* смена содержимого панели режима: старое гаснет с размытием, слово в шапке меняется, новое въезжает строками */
      function swapMode(t,outB,outT,inB,inT){
        tl.to(outB,{opacity:0,filter:'blur(8px)',duration:.18,ease:'power2.in'},t);
        tl.to(outT,{opacity:0,filter:'blur(6px)',duration:.15,ease:'power2.in'},t+.05);
        tl.fromTo(inT,{opacity:0,filter:'blur(6px)'},{immediateRender:false,opacity:1,filter:'blur(0px)',duration:.15,ease:'power2.out'},t+.15);
        tl.fromTo(inB+' > *',{opacity:0,y:16},{immediateRender:false,opacity:1,y:0,duration:.3,stagger:.03,ease:'power3.out'},t+.15);
      }
      gsap.set('#ui-cam',{scale:BASE,x:160,y:6});
      gsap.set('#ui-cur-in',{x:cur.x,y:cur.y,scale:1});
      gsap.set('#ui-r-chats',{backgroundColor:RAISED}); gsap.set('#ui-r-chats svg',{stroke:ACC});
      gsap.set('#ui-r-proj,#ui-r-team',{backgroundColor:CLEAR}); gsap.set('#ui-r-proj svg,#ui-r-team svg',{stroke:INK2});
      gsap.set('#ui-r-inbox',{backgroundColor:CLEAR});
      gsap.set('#ui-m-x',{backgroundColor:CLEAR,color:'#88888f'});
      gsap.set('#ui-mode',{x:0}); gsap.set('#ui-topl',{x:280}); gsap.set('#ui-nc,#ui-feed',{x:140});

      /* сцена 1 · 0–1.6: всё окно, кадр A2; курсор въезжает */
      moveTo(0.9,.6,600,500,'power3.out');

      /* сцена 2 · 1.6–2.7: наезд на рейку с панелью; курсор на «Входящие» в рейке; клик */
      camTo(1.6,.55,2.2,-24,-24);
      moveTo(1.75,.5,28,231);
      hov(2.3,'#ui-r-inbox');
      click(2.5);
      tl.to('#ui-m-inbox',{backgroundColor:RAISED,borderColor:'#2d2d32',duration:.15},2.55);

      /* сцена 3 · 2.55–5.3: «Новый чат» гаснет, лента «Входящих» выезжает; камера → обзор 1.3× */
      tl.fromTo('#ui-nc',{opacity:1,filter:'blur(0px)'},{immediateRender:false,opacity:0,filter:'blur(8px)',duration:.18,ease:'power2.in'},2.6);
      tl.fromTo('#ui-top-nc',{opacity:1},{immediateRender:false,opacity:0,duration:.12},2.6);
      tl.fromTo('#ui-topr-nc',{opacity:1},{immediateRender:false,opacity:0,duration:.12},2.6);
      tl.fromTo('#ui-top-ib > *',{opacity:0,x:-8},{immediateRender:false,opacity:1,x:0,duration:.15,stagger:.05,ease:'power2.out'},2.7);
      tl.fromTo('#ui-topr-ib',{opacity:0},{immediateRender:false,opacity:1,duration:.15},2.75);
      tl.fromTo('#ui-col > *',{opacity:0,y:24},{immediateRender:false,opacity:1,y:0,duration:.3,stagger:.04,ease:'power3.out'},2.75);
      camTo(2.75,.6,1.2,-10,-6);
      moveTo(3.3,.5,480,520);

      /* сцена 4 · 5.3–8.7: наезд на рейку; клик «Проект» → панель меняется на карточку проекта и разделы */
      camTo(5.3,.55,2.2,-24,-24);
      moveTo(5.4,.5,28,283);
      hov(5.9,'#ui-r-proj');
      click(6.1);
      off(6.15,'#ui-r-chats'); on(6.15,'#ui-r-proj');
      swapMode(6.15,'#ui-m-chats','#ui-mt-chats','#ui-m-proj','#ui-mt-proj');
      moveTo(6.8,.5,520,420);

      /* сцена 5 · 8.7–12.0: клик «Команда» → панель меняется на роли */
      moveTo(8.7,.5,28,324);
      hov(9.2,'#ui-r-team');
      click(9.4);
      off(9.45,'#ui-r-proj'); on(9.45,'#ui-r-team');
      swapMode(9.45,'#ui-m-proj','#ui-mt-proj','#ui-m-team','#ui-mt-team');
      moveTo(10.1,.5,520,420);

      /* сцена 6 · 12.0–15.4: клик «×» → панель уезжает под рейку, рабочая область расширяется; камера → всё окно */
      moveTo(12.0,.5,313,25);
      tl.to('#ui-m-x',{backgroundColor:RAISED,color:'#ececee',duration:.12},12.5);
      click(12.7);
      tl.to('#ui-m-x',{backgroundColor:CLEAR,color:'#88888f',duration:.12},12.72);
      tl.to('#ui-mode',{x:-280,duration:.5,ease:'power3.inOut'},12.75);
      tl.to('#ui-topl',{x:0,duration:.5,ease:'power3.inOut'},12.8);
      tl.to('#ui-nc,#ui-feed',{x:0,duration:.5,ease:'power3.inOut'},12.8);
      off(12.75,'#ui-r-team');
      camTo(12.8,.6,BASE,-160,-6);
      moveTo(12.9,.6,700,520);

      /* сцена 7 · 15.4–18.2: наезд на рейку; клик «Команда» снова → панель возвращается */
      camTo(15.4,.55,2.2,-24,-24);

      hov(16.0,'#ui-r-team');
      click(16.2);
      on(16.25,'#ui-r-team');

      tl.to('#ui-nc,#ui-feed',{x:140,duration:.5,ease:'power3.inOut'},16.3);
      moveTo(17.0,.5,520,420);

      /* сцена 8 · 18.3–19.2: курсор на знак в шапке рейки, клик, камера летит в знак, затемнение → финальная карточка */

      click(18.75);
      tl.fromTo('#ui-rlogo',{borderColor:'#2d2d32'},{immediateRender:false,borderColor:'#c27a34',duration:.1},18.75);
      camTo(18.8,.35,7.5,28-960/7.5,25-456/7.5,'power3.in');
      tl.to('#ui-cam',{filter:'blur(10px)',duration:.2,ease:'power2.in'},18.95);
      tl.fromTo('#ui-dip',{opacity:0},{immediateRender:false,opacity:.7,duration:.2,ease:'power2.in'},18.95);

      window.__timelines['ui']=tl;
    })();
