# harness.autoiflow.com — ПРЕЖНИЙ адрес Harnessy. С 07.10.2026 сайт живёт на https://harnessy.ai (слово владельца).
# Этот блок только перенаправляет, кроме двух служебных путей:
#  - /auth/tg/webhook — вебхук бота Telegram (перенесён на harnessy.ai; проброс оставлен на время переключения);
#  - /auth/<github|google>/callback — возвраты OAuth: в консолях GitHub и Google зарегистрирован этот домен,
#    поэтому возврат передаётся на harnessy.ai 302 со строкой запроса (state, code) — cookie состояния лежит там.
# Блок туннеля nl99.autoiflow.com не трогаем. Откат: вернуть файл из /harness/backup/nginx-etc-before-domain-20261007.tgz.
server {
    listen 80;
    listen [::]:80;
    server_name harness.autoiflow.com;
    root /harness/site;
    location ^~ /.well-known/acme-challenge/ { root /harness/site; default_type "text/plain"; }
    location / { return 301 https://harnessy.ai$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harness.autoiflow.com;

    ssl_certificate     /etc/letsencrypt/live/harness.autoiflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness.autoiflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/harness.access.log;
    error_log  /var/log/nginx/harness.error.log;

    location = /auth/tg/webhook {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Next $request_uri;
    }
    location ~ ^/auth/(github|google)/callback$ { return 302 https://harnessy.ai$request_uri; }
    location / { return 301 https://harnessy.ai$request_uri; }
}
