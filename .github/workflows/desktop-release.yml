name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and release destination
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./ui/desktop/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo 'Тег не совпадает с версией desktop'; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo 'Первый подписанный выпуск должен быть beta; alpha не публикуется'; exit 1; }
          repo="$(node -p "require('./ui/desktop/updates.js').RELEASE_REPOSITORY")"
          test "$repo" != OWNER_CONFIRM_RELEASE_REPOSITORY || { echo 'Имя публичного репозитория релизов ещё не подтверждено'; exit 1; }
          grep -Fq "repo: $repo" ui/desktop/electron-builder.yml || { echo 'Источник обновлений и место публикации различаются'; exit 1; }
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || { echo 'Нужен аннотированный тег с описанием изменений'; exit 1; }
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo 'Описание тега пусто'; exit 1; }
          echo "RELEASE_REPO=sergekostenchuk/$repo" >> "$GITHUB_ENV"
          if [[ "$version" == *-beta.* ]]; then echo 'RELEASE_CHANNEL=beta' >> "$GITHUB_ENV"; else echo 'RELEASE_CHANNEL=latest' >> "$GITHUB_ENV"; fi
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui/desktop ci
      - name: Prepare App Store Connect key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_KEY" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8" || { echo 'APPLE_API_KEY пуст'; exit 1; }
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --prefix ui/desktop run dist
      - name: Validate signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          app="$(find ui/desktop/release -type d -name '*.app' -print -quit)"
          test -n "$app" || { echo 'Собранное приложение не найдено'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          find ui/desktop/release -maxdepth 1 -name '*.dmg' -print -quit | grep -q .
          find ui/desktop/release -maxdepth 1 -name '*.zip' -print -quit | grep -q .
          find ui/desktop/release -maxdepth 1 -name '*-mac.yml' -print -quit | grep -q .
      - name: Publish release binaries and tag description
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HARNESSY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Нет токена репозитория релизов'; exit 1; }
          shopt -s nullglob
          assets=(ui/desktop/release/*.dmg ui/desktop/release/*.zip ui/desktop/release/*.yml ui/desktop/release/*.blockmap)
          test "${#assets[@]}" -ge 3 || { echo 'Набор релиза неполон'; exit 1; }
          flags=(); if [[ "$RELEASE_CHANNEL" == beta ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$RELEASE_REPO" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
      - name: Remove temporary App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
