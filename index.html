<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат Claude</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1b1b1b; --muted:#6b6b6b; --me:#dfe9ff; --ai:#ffffff; --line:#dcdcd7; --accent:#3b6cff; --err:#b3261e; --tool:#5a5a5a; --toolbg:#ecece8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eaeaea; --muted:#9a9a9a; --me:#243a6b; --ai:#222222; --line:#333; --accent:#7b9cff; --err:#ff8a80; --tool:#b0b0b0; --toolbg:#1f1f1f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; height:100vh; display:flex; flex-direction:column; }
  #top { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #top label { color:var(--muted); }
  #cwd { flex:1; min-width:280px; font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--ai); color:var(--fg); }
  select, button, input { font:inherit; }
  select, button { padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--ai); color:var(--fg); max-width:220px; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button:disabled { opacity:.5; }
  #banner { display:none; padding:8px 12px; background:#fff3cd; color:#5c4400; border-bottom:1px solid #e6d9a3; }
  #banner code { background:rgba(0,0,0,.08); padding:2px 5px; border-radius:4px; }
  #panes { flex:1; display:flex; min-height:0; }
  .pane { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .pane:last-child { border-right:none; }
  .pane header { display:flex; gap:6px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pane header .conv { flex:1; min-width:120px; }
  .pane main { flex:1; overflow:auto; padding:12px 10px; }
  .msg { margin:0 0 10px; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .me { background:var(--me); }
  .ai { background:var(--ai); border:1px solid var(--line); }
  .tool { margin:-4px 0 8px; padding:3px 10px; font-size:12px; color:var(--tool); background:var(--toolbg); border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { margin:-4px 0 12px; font-size:12px; color:var(--muted); }
  .error { color:var(--err); }
  .pane footer { border-top:1px solid var(--line); padding:8px 10px; }
  .row { display:flex; gap:6px; align-items:flex-end; }
  textarea { flex:1; min-height:40px; max-height:200px; resize:vertical; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--ai); color:var(--fg); }
  .status { margin-top:4px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="top">
  <label for="cwd">Папка проекта</label>
  <input id="cwd" placeholder="/полный/путь/к/папке">
  <button id="applyCwd">Применить</button>
  <span id="cwdInfo" class="status"></span>
</div>
<div id="banner"></div>
<div id="panes"></div>
<script>
(() => {
  const KEY = 'simple-claude-chat-v2';
  let cfg = null;                 // /api/status
  let state = { cwd: null, panes: [{}, {}] };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && Array.isArray(s.panes) && s.panes.length === 2) state = s; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
  const $cwd = document.getElementById('cwd'), $info = document.getElementById('cwdInfo'), $banner = document.getElementById('banner');
  const panes = [];

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }

  class Pane {
    constructor(idx) {
      this.idx = idx;
      this.s = state.panes[idx];
      this.busy = false;
      const root = el('div', 'pane');
      const header = el('header');
      this.model = el('select'); this.model.title = 'Модель';
      this.mode = el('select'); this.mode.title = 'Доступ к папке';
      this.conv = el('select', 'conv'); this.conv.title = 'Разговор';
      this.newBtn = el('button', null, 'Новый');
      header.append(this.model, this.mode, this.conv, this.newBtn);
      this.log = el('main');
      const footer = el('footer');
      const row = el('div', 'row');
      this.input = el('textarea'); this.input.placeholder = 'Сообщение… (Enter — отправить, Shift+Enter — новая строка)';
      this.sendBtn = el('button', 'primary', 'Отправить');
      row.append(this.input, this.sendBtn);
      this.status = el('div', 'status');
      footer.append(row, this.status);
      root.append(header, this.log, footer);
      document.getElementById('panes').appendChild(root);

      for (const m of cfg.models) { const o = el('option', null, m.label); o.value = m.id; this.model.appendChild(o); }
      for (const m of cfg.modes) { const o = el('option', null, m.label); o.value = m.id; this.mode.appendChild(o); }
      this.model.value = cfg.models.some(m => m.id === this.s.model) ? this.s.model : cfg.defaultModel;
      this.mode.value = cfg.modes.some(m => m.id === this.s.mode) ? this.s.mode : cfg.defaultMode;
      this.s.model = this.model.value; this.s.mode = this.mode.value; save();

      this.model.onchange = () => { this.s.model = this.model.value; save(); };
      this.mode.onchange = () => { this.s.mode = this.mode.value; save(); this.setStatus('Режим: ' + this.mode.selectedOptions[0].text); };
      this.conv.onchange = () => { const id = this.conv.value; if (id) this.open(id); else this.newChat(); };
      this.newBtn.onclick = () => this.newChat();
      this.sendBtn.onclick = () => this.send();
      this.input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } });
    }
    setStatus(t) { this.status.textContent = t; }
    add(role, text) { const d = el('div', 'msg ' + (role === 'me' ? 'me' : 'ai'), text); this.log.appendChild(d); this.log.scrollTop = this.log.scrollHeight; return d; }
    meta(text, isErr) { const d = el('div', 'meta' + (isErr ? ' error' : ''), text); this.log.appendChild(d); this.log.scrollTop = this.log.scrollHeight; }
    toolLine(text, isErr) { const d = el('div', 'tool' + (isErr ? ' error' : ''), text); this.log.appendChild(d); this.log.scrollTop = this.log.scrollHeight; }

    async refreshList(sessions) {
      const cur = this.s.sessionId || '';
      this.conv.innerHTML = '';
      const o0 = el('option', null, '— новый разговор —'); o0.value = ''; this.conv.appendChild(o0);
      for (const s of sessions) {
        const o = el('option', null, s.title + ' · ' + fmtDate(s.updated) + ' · ' + s.count);
        o.value = s.id; this.conv.appendChild(o);
      }
      this.conv.value = sessions.some(s => s.id === cur) ? cur : '';
      if (!this.conv.value && cur) { this.s.sessionId = null; save(); }
    }
    async open(id) {
      const r = await fetch('/api/sessions/' + id + '?cwd=' + encodeURIComponent(state.cwd));
      if (!r.ok) { this.meta('Не удалось открыть разговор', true); return; }
      const { messages } = await r.json();
      this.s.sessionId = id; save();
      this.log.innerHTML = '';
      for (const m of messages) this.add(m.role, m.text);
      this.conv.value = id;
      this.setStatus('Сессия ' + id.slice(0, 8) + ' · продолжение');
      this.input.focus();
    }
    newChat() {
      this.s.sessionId = null; save();
      this.log.innerHTML = '';
      this.conv.value = '';
      this.setStatus('Новый разговор · ' + this.mode.selectedOptions[0].text);
      this.input.focus();
    }
    async send() {
      const text = this.input.value.trim();
      if (!text || this.busy) return;
      if (!state.cwd) { this.meta('Сначала укажи папку проекта сверху', true); return; }
      this.input.value = '';
      this.busy = true; this.sendBtn.disabled = true;
      this.add('me', text);
      let box = null;      // текущий пузырь ответа; после вызова инструмента текст идёт новым пузырём
      let acc = '';
      try {
        const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, model: this.s.model, mode: this.s.mode, cwd: state.cwd, sessionId: this.s.sessionId }) });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
        const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
        this.setStatus('Модель работает…');
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const frame = buf.slice(0, i); buf = buf.slice(i + 2);
            const line = frame.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            const ev = JSON.parse(line.slice(6));
            if (ev.type === 'delta') {
              if (!box) box = this.add('ai', '');
              acc += ev.text; box.textContent += ev.text; this.log.scrollTop = this.log.scrollHeight;
            }
            else if (ev.type === 'tool') { box = null; this.toolLine('▸ ' + ev.name + (ev.detail ? ': ' + ev.detail : '')); }
            else if (ev.type === 'toolError') { box = null; this.toolLine('✕ ' + ev.text, true); }
            else if (ev.type === 'done') {
              this.s.sessionId = ev.sessionId || this.s.sessionId; save();
              const u = ev.usage || {};
              this.meta(`${ev.model} · ${((ev.durationMs || 0) / 1000).toFixed(1)} с · токены вход ${u.input ?? '—'} / выход ${u.output ?? '—'}` + (u.cacheRead ? ` / кэш ${u.cacheRead}` : ''));
              this.setStatus('Сессия ' + (this.s.sessionId || '').slice(0, 8) + ' · ' + ev.model + ' · ' + this.mode.selectedOptions[0].text);
            }
            else if (ev.type === 'error') {
              if (ev.sessionId) { this.s.sessionId = ev.sessionId; save(); }
              this.meta('Ошибка: ' + ev.message, true); this.setStatus('Ошибка');
            }
          }
        }
      } catch (e) {
        this.meta('Ошибка: ' + e.message, true);
      } finally {
        for (const b of this.log.querySelectorAll('.ai')) if (!b.textContent) b.remove();
        this.busy = false; this.sendBtn.disabled = false;
        refreshLists().catch(() => {});
        this.input.focus();
      }
    }
  }

  async function refreshLists() {
    if (!state.cwd) return;
    const r = await fetch('/api/sessions?cwd=' + encodeURIComponent(state.cwd));
    if (!r.ok) return;
    const { sessions } = await r.json();
    for (const p of panes) await p.refreshList(sessions);
  }
  async function applyCwd(newCwd, silent) {
    const r = await fetch('/api/dir?cwd=' + encodeURIComponent(newCwd));
    const d = await r.json();
    if (!d.ok) { $info.textContent = d.error; $info.className = 'status error'; return false; }
    const changed = state.cwd !== d.cwd;
    state.cwd = d.cwd; save();
    $cwd.value = d.cwd;
    $info.className = 'status';
    $info.textContent = 'Журналы: ' + d.sessionsDir + (d.hasClaudeMd ? ' · в папке есть CLAUDE.md, он попадёт в контекст' : '');
    if (changed) for (const p of panes) p.newChat();
    await refreshLists();
    if (!changed && !silent) for (const p of panes) if (p.s.sessionId) await p.open(p.s.sessionId);
    return true;
  }
  document.getElementById('applyCwd').onclick = () => applyCwd($cwd.value.trim());
  $cwd.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCwd($cwd.value.trim()); });

  (async () => {
    try {
      cfg = await (await fetch('/api/status')).json();
      if (!cfg.auth || !cfg.auth.loggedIn) {
        $banner.style.display = 'block';
        $banner.innerHTML = 'Вход по подписке не выполнен. Открой Терминал и выполни <code>claude login</code>, затем обнови страницу.';
      }
      panes.push(new Pane(0), new Pane(1));
      const ok = await applyCwd(state.cwd || cfg.defaultDir, true);
      if (!ok) await applyCwd(cfg.defaultDir, true);
      for (const p of panes) if (p.s.sessionId) await p.open(p.s.sessionId); else p.newChat();
    } catch (e) {
      $banner.style.display = 'block'; $banner.textContent = 'Сервер не отвечает: ' + e.message;
    }
  })();
})();
</script>
</body>
</html>
